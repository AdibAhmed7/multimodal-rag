# Model Configurations for Multimodal RAG Pipeline

embeddings:
  text:
    provider: "huggingface"
    model_name: "BAAI/bge-m3"
    dimension: 1024
    batch_size: 4
  vision:
    provider: "huggingface"
    model_name: "google/siglip2-base-patch16-224"
    dimension: 768
    batch_size: 4

llm:
  generation:
    default_cloud_provider: "gemini"
    gemini_model: "gemini-2.5-flash"
    openai_model: "gpt-4o-mini"
    local_model: "Qwen/Qwen2.5-VL-3B-Instruct"
    temperature: 0.2
    max_tokens: 1024
  vision:
    default_cloud_provider: "gemini"
    gemini_model: "gemini-2.5-flash"
    openai_model: "gpt-4o-mini"
    temperature: 0.2
