# Model Configurations for Multimodal RAG Pipeline

embeddings:
  text:
    provider: "huggingface"
    model_name: "BAAI/bge-m3"
    dimension: 1024
    batch_size: 4
  vision:
    provider: "huggingface"
    model_name: "google/siglip2-base-patch16-224"
    dimension: 768
    batch_size: 4

llm:
  generation:
    provider: "openai"
    model_name: "gpt-4o"
    temperature: 0.2
    max_tokens: 2048
  vision:
    provider: "openai"
    model_name: "gpt-4o"
    temperature: 0.2
